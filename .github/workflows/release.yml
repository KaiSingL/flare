name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Bundle extension
        run: |
          mkdir -p dist
          zip -r dist/flare-extension.zip \
            manifest.json \
            popup.html popup.js popup.css \
            content.js content.css \
            background.js \
            providers.js \
            icons/ \
            -x "*.DS_Store"
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/flare-extension.zip
          generate_release_notes: true
